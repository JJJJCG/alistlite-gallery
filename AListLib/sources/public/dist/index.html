<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Loading...</title>
<!-- 这两处会被后端 server/static/static.go 换成站点设置里的 favicon / logo -->
<link rel="icon" href="https://res.oplist.org/logo/logo.svg">
<link rel="manifest" href="/manifest.json">
<script>
/* 下面 CONFIG 里的四个占位字段（值均为 undefined）由后端 static.go 的
 * initIndex() / UpdateIndex() 各替换一次 —— 只替换第一次出现，所以注释里
 * 不要重复出现「字段名 + undefined」的组合字面量，否则会错位替换到注释上：
 *   cdn 与 base_path —— 站点配置的 CDN 与 URL 路径前缀；
 *   main_color —— 主题色；
 *   asset_ver —— gallery.js 的内容哈希。
 * 为什么需要 asset_ver：/assets/* 带半年长缓存，升级后浏览器只能靠 URL 变化
 * （资源地址追加 ?v=哈希）拿到新文件，否则旧设备会一直用旧脚本、在新 DOM 上
 * 报错，表现为页面永远加载不出来。
 * 静态资源地址只能在运行时拼，写死 href/src 会让自定义路径前缀失效。
 */
window.CONFIG = { base_path: undefined, cdn: undefined, main_color: undefined, asset_ver: undefined };
(function () {
  var c = window.CONFIG || {};
  var trim = function (s) { return String(s || '').replace(/\/+$/, ''); };
  var base = typeof c.base_path === 'string' ? trim(c.base_path) : '';
  var assetBase = (typeof c.cdn === 'string' && c.cdn) ? trim(c.cdn) + base : base;
  var vq = (typeof c.asset_ver === 'string' && c.asset_ver) ? ('?v=' + c.asset_ver) : '';
  window.__assetBase = assetBase;
  window.__assetVQ = vq;
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = assetBase + '/assets/gallery.css' + vq;
  document.head.appendChild(link);
})();
/* 脚本/资源加载出错时把原因显示在首屏遮罩上，避免「永远 Loading」无从排查。
   常见场景：升级后浏览器仍用缓存的旧脚本 —— 清一次缓存或用无痕窗口即可。 */
window.addEventListener('error', function (e) {
  var b = document.getElementById('boot');
  if (!b) return;
  var msg;
  if (e && e.message) msg = e.message;
  else if (e && e.target && (e.target.src || e.target.href)) msg = '资源加载失败：' + (e.target.src || e.target.href);
  else msg = '未知错误';
  var t = b.querySelector('.boot-text');
  if (t) {
    t.textContent = '脚本出错：' + msg + ' —— 若刚升级过 App，多半是浏览器缓存了旧页面：请清一次该站点缓存，或用无痕窗口再试。';
    t.style.fontSize = '13px';
    t.style.maxWidth = '88%';
    t.style.lineHeight = '1.7';
    t.style.fontWeight = '400';
  }
}, true);
</script>
<!-- customize head -->
</head>
<body>

<!-- 首屏占位：文本 "Loading..." 会被后端替换成站点标题 -->
<div id="boot">
  <div class="boot-ring"></div>
  <div class="boot-text">Loading...</div>
</div>

<!-- 顶栏已按需求移除：上传/诊断收进侧边栏，搜索移到筛选栏；移动端从筛选栏左侧的汉堡按钮打开侧边栏 -->

<aside id="sidebar" aria-label="媒体库导航">
  <div class="side-group">
    <ul class="menu">
      <li><button id="navAll" class="menu-btn" data-active="false">
        <span class="mi" style="background:#8ac5f4">
          <svg viewBox="0 0 24 24" fill="white"><path d="M5.6 14L9.6 18 5.4 24H3a3 3 0 0 1-3-2.7L5.6 14Zm10.1-4L24 21.5A3 3 0 0 1 21 24H5.9L15.7 10Z"/></svg>
        </span><span class="ml">全部</span></button></li>
      <li><button id="navUpload" class="menu-btn" data-active="false">
        <span class="mi" style="background:#9fd6a8">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </span><span class="ml">上传到当前文件夹</span></button></li>
    </ul>
  </div>
  <div class="side-group">
    <div class="side-title">挂载的存储</div>
    <div id="tree" class="tree"></div>
  </div>
  <div class="side-group side-foot">
    <ul class="menu">
      <li><button id="navDiag" class="menu-btn" data-active="false">
        <span class="mi" style="background:#c9b3e6">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
        </span><span class="ml">连接与诊断</span></button></li>
      <li><button id="navAccount" class="menu-btn" data-active="false">
        <span class="mi" style="background:#fbcd78">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="9" r="3.4"/><path d="M5.4 19.6c1.3-3.1 3.8-4.6 6.6-4.6s5.3 1.5 6.6 4.6"/></svg>
        </span><span class="ml" id="accountLabel">账号</span></button></li>
      <li><button id="navSettings" class="menu-btn" data-active="false">
        <span class="mi" style="background:#aacbd0">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M4.2 7.5l1.9 1.1M17.9 15.4l1.9 1.1M4.2 16.5l1.9-1.1M17.9 8.6l1.9-1.1"/></svg>
        </span><span class="ml">挂载管理</span></button></li>
    </ul>
  </div>
</aside>
<div id="scrim"></div>

<main id="content">
  <div id="banner" hidden></div>

  <div id="filterbar">
    <button id="btnMenu" class="icon-btn narrow-only" aria-label="打开菜单">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="搜索名称…" autocomplete="off">
    </div>
    <div class="grow"></div>
    <div class="seg" id="segKind">
      <button data-kind="all" data-active="true">全部</button>
      <button data-kind="image" data-active="false">图片</button>
      <button data-kind="video" data-active="false">视频</button>
    </div>

    <!-- 只在「全部」（时间轴）视图出现：明确写出扫描范围和深度，避免误扫整个存储 -->
    <span class="mini only-all" id="scanScope"></span>
    <button class="btn ghost small only-all" id="btnScopeRoot">改为扫全部挂载</button>
    <label class="mini only-all">深度
      <select id="depthSel">
        <option value="1">1 层</option>
        <option value="2">2 层</option>
        <option value="3">3 层</option>
        <option value="5">5 层</option>
        <option value="0">全部层级</option>
      </select>
    </label>

    <div class="grow"></div>
    <label class="mini">排序
      <select id="sortSel">
        <option value="date">按时间</option>
        <option value="name">按名称</option>
        <option value="size">按大小</option>
      </select>
    </label>
    <label class="mini narrow-hide">大小
      <select id="sizeSel">
        <option value="200">标准</option>
        <option value="150">紧凑</option>
        <option value="300">大图</option>
      </select>
    </label>
    <button id="btnRefresh" class="btn ghost">刷新</button>
  </div>

  <div id="headTitle" class="album-title"></div>
  <div id="stat" class="stat"></div>
  <div id="albums" class="albums"></div>
  <div id="grid"></div>
</main>

<!-- 全屏查看器 -->
<div id="viewer" hidden>
  <div id="vStage" class="v-stage"></div>
  <div id="vNav" class="v-nav">
    <button id="vPrev" aria-label="上一个">
      <svg viewBox="0 0 48 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8L12 32l20 24"/></svg>
    </button>
    <button id="vNext" aria-label="下一个">
      <svg viewBox="0 0 48 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8l20 24-20 24"/></svg>
    </button>
  </div>
  <div id="vTop" class="v-top">
    <button id="vClose" class="v-btn" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <div class="grow"></div>
    <div id="vTitle" class="v-title"></div>
    <button id="vCopy" class="v-btn" title="复制下载链接">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
    </button>
    <button id="vMore" class="v-btn" title="更多操作">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </div>
</div>

<div id="ctxMenu" hidden></div>

<!-- 诊断面板：列表或扫描异常时把真实原因摆出来，避免「什么都没有」这种无从下手的现象 -->
<div id="diag" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><b>连接状态与诊断</b><button class="icon-btn" data-close="diag">✕</button></div>
    <div class="sheet-body" id="diagBody"></div>
    <div class="sheet-foot">
      <button class="btn ghost" id="diagRerun">重新检测</button>
      <button class="btn ghost" id="diagLogout">退出登录</button>
    </div>
  </div>
</div>

<!-- 挂载管理 -->
<div id="admin" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><b>挂载管理</b><button class="icon-btn" data-close="admin">✕</button></div>
    <div class="sheet-body">
      <div id="storageList" class="storage-list"></div>
      <div class="sep"></div>
      <div id="stFormTitle" class="sub-title">新增挂载</div>
      <div class="form">
        <label>类型
          <select id="stDriver">
            <option value="Local">本地存储（手机里的文件夹）</option>
            <option value="SMB">SMB / Windows 共享</option>
            <option value="SFTP">SFTP</option>
            <option value="WebDav">WebDAV</option>
          </select>
        </label>
        <label>挂载路径（显示在侧边栏，如 /相册） <input id="stMount" placeholder="/相册" value="/"></label>
        <label>要挂载的目录 <input id="stRoot" placeholder="/storage/emulated/0/DCIM"></label>
        <div id="stDriverFields"></div>
        <div class="hint" id="stDriverHint"></div>
        <div class="form-row">
          <label>排序 <input id="stOrder" type="number" value="0"></label>
          <label class="row-check"><input type="checkbox" id="stSign"> 启用签名（更安全）</label>
        </div>
        <details id="stAdvanced">
          <summary>高级：直接编辑配置（JSON）</summary>
          <textarea id="stAddition" spellcheck="false"></textarea>
          <div class="hint">一般不用动。上面填的内容会自动生成正确的配置。</div>
        </details>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn ghost" id="stCancel">清空表单</button>
      <button class="btn primary" id="stSave">保存挂载</button>
    </div>
  </div>
</div>

<!-- 确认框：App 的 WebView 没实现 window.confirm（点了没反应），关键操作用这个弹层 -->
<div id="confirmBox" class="sheet" hidden>
  <div class="sheet-card narrow">
    <div class="sheet-head"><b>确认操作</b></div>
    <div class="sheet-body"><div id="confirmMsg" class="confirm-msg"></div></div>
    <div class="sheet-foot">
      <button class="btn ghost" id="confirmNo">取消</button>
      <button class="btn primary" id="confirmYes">确认</button>
    </div>
  </div>
</div>

<!-- 移动到…：浏览式选择目标文件夹，确认后调 /api/fs/move -->
<div id="moveSheet" class="sheet" hidden>
  <div class="sheet-card narrow">
    <div class="sheet-head"><b>移动到…</b><button class="icon-btn" data-close="moveSheet">✕</button></div>
    <div class="sheet-body">
      <div id="moveCrumb" class="move-crumb"></div>
      <div id="moveDirs" class="move-dirs"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn ghost" id="moveCancel">取消</button>
      <button class="btn primary" id="moveGo">移动到这里</button>
    </div>
  </div>
</div>

<!-- 账号：服务端已全端免密（无 token 一律按管理员），这里主要展示当前身份 -->
<div id="login" class="sheet" hidden>
  <div class="sheet-card narrow">
    <div class="sheet-head"><b>账号</b><button class="icon-btn" data-close="login">✕</button></div>
    <div class="sheet-body">
      <div id="loginState" class="state-box">检测中…</div>
      <div class="hint" style="margin-top:10px">
        本应用不设密码：不管在 App 内还是局域网访问，都以管理员身份直接使用，无需登录。
        下面的表单仅在后端为旧版本（还要求登录）时才会用到。
      </div>
      <div class="form" style="margin-top:14px">
        <label>用户名 <input id="loginUser" autocomplete="username"></label>
        <label>密码 <input id="loginPass" type="password" autocomplete="current-password"></label>
      </div>
      <div class="hint" id="loginMsg"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn ghost" id="loginLogout">清除登录状态</button>
      <button class="btn primary" id="loginBtn">登录</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="filePicker" multiple accept="image/*,video/*" hidden>
<!-- customize body -->

<script>
(function () {
  var s = document.createElement('script');
  s.src = (window.__assetBase || '') + '/assets/gallery.js' + (window.__assetVQ || '');
  s.defer = true;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
